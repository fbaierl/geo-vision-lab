name: Integration Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'app/ingestion/**'
      - 'app/services/**'
      - 'tests/test_db_integration.py'
      - 'tests/test_ingestion.py'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # MongoDB service for integration tests
      mongodb:
        image: mongodb/mongodb-atlas-local:8.2
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov testcontainers[mongodb]
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Start Ollama service
      run: |
        docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
        sleep 10
        # Pull required models
        docker exec ollama ollama pull qwen3.5:4b
        docker exec ollama ollama pull all-minilm-l6-v2

    - name: Run integration tests
      env:
        CI: false  # Override CI flag to allow integration tests to run
        OLLAMA_BASE_URL: http://localhost:11434
        MONGODB_SERVER: localhost
        MONGODB_PORT: 27017
      run: |
        pytest -v tests/test_db_integration.py tests/test_ingestion.py --cov=app --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: integration
