services:
  ollama:
    image: ollama/ollama:latest
    container_name: geovision-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull qwen3.5:9b &&
             ollama pull qwen3.5:4b &&
             ollama pull gemma4:e2b &&
             wait"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  mongodb:
    image: mongodb/mongodb-atlas-local:8.2
    container_name: geovision-mongodb
    hostname: geovision-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_configdb:/data/configdb
      - mongodb_mongot:/data/mongot
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5.26
    container_name: geovision-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/geovision
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "geovision", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- Self-Hosted Nominatim (DISABLED by default) ---
  # Uncomment to enable local geocoding. Requires:
  #   - 120GB+ RAM for full planet, 8GB+ for single continent
  #   - 1-2 hours initial import time
  #   - ~100GB disk space for world, ~30GB for Europe
  # Change PBF_URL to desired region:
  #   World:     https://download.geofabrik.de/world-latest.osm.pbf
  #   Europe:    https://download.geofabrik.de/europe-latest.osm.pbf
  #   N. America: https://download.geofabrik.de/north-america-latest.osm.pbf
  #
  # nominatim:
  #   image: mediagis/nominatim:4.4
  #   container_name: geovision-nominatim
  #   restart: unless-stopped
  #   ports:
  #     - "8083:8080"
  #   environment:
  #     - PBF_URL=https://download.geofabrik.de/world-latest.osm.pbf
  #     - REPLICATION_URL=https://download.geofabrik.de/world-updates/
  #     - NOMINATIM_PASSWORD=geovision
  #     - IMPORT_STYLE=extratags
  #     - FLATNODE_FILE=/nominatim/data/flatnodes
  #   volumes:
  #     - nominatim-data:/var/lib/postgresql/14/main
  #     - nominatim-cache:/nominatim/data
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 8G
  #       reservations:
  #         memory: 4G
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/search?q=Berlin&format=json"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s

  mongo-express:
    image: mongo-express:latest
    container_name: geovision-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://geovision-mongodb:27017/?directConnection=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=geovision
    depends_on:
      mongodb:
        condition: service_healthy


  ingest:
    build: .
    container_name: geovision-ingest
    volumes:
      - ./documents:/app/documents
      - hf_cache:/root/.cache/huggingface
    environment:
      - MONGODB_URI=mongodb://geovision-mongodb:27017/geovision?directConnection=true
      - OLLAMA_HOST=http://geovision-ollama:11434
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: python -m app.ingestion.ingest
    restart: "no"

  app:
    build: .
    container_name: geovision-app
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    environment:
      - OLLAMA_HOST=http://geovision-ollama:11434
      - MONGODB_URI=mongodb://geovision-mongodb:27017/geovision?directConnection=true
      - NEO4J_URI=bolt://geovision-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=geovision
      - LANGSMITH_TRACING=true
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      - LANGSMITH_PROJECT=geo-vision-lab
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NOMINATIM_URL=${NOMINATIM_URL:-}
      - NOMINATIM_TIMEOUT=${NOMINATIM_TIMEOUT:-10}
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
      ingest:
        condition: service_completed_successfully
      # nominatim:
      #   condition: service_started
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.services.setup_mongodb && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # --- Monitoring Stack ---

  loki:
    image: grafana/loki:latest
    container_name: geovision-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: geovision-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: geovision-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=geovision
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - loki

  dozzle:
    image: amir20/dozzle:latest
    container_name: geovision-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_configdb:
  mongodb_mongot:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  ollama_data:
  hf_cache:
  loki_data:
  grafana_data:
  # nominatim-data:
  # nominatim-cache:
